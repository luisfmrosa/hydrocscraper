- name: Install packages
  ansible.builtin.apt:
    # python3-packaging is needed by Ansible's pip module
    name: [git, python3-venv, python3-packaging]

- name: Checkout repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version | default('main') }}"

- name: Install Python requirements
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/.venv"
    virtualenv_command: python3 -m venv

- name: Render .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"
  no_log: true
